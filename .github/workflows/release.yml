# Go modules are released by tagging. On each merge to main, tag the next version:
# a minor bump if the merged PR has the semver:minor label (set by
# phasetwo-sdk-generator for breaking spec changes), otherwise a patch bump.
# The first release is v0.1.0. Skip with [ci skip] in the commit message.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test ./...
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=v0.1.0   # first release
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qx 'semver:minor' <<< "$labels"; then
              next="v$major.$((minor + 1)).0"
            else
              next="v$major.$minor.$((patch + 1))"
            fi
          fi
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          gh release create "$next" --generate-notes --verify-tag
          # Ask the Go module proxy to fetch the new version so pkg.go.dev shows it.
          curl -fsS "https://proxy.golang.org/github.com/$GITHUB_REPOSITORY/@v/$next.info" || true
