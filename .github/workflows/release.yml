# Go modules are released by tagging. On each merge to main, tag the next version.
# Versions follow the API version in sdk-generator.json (the spec's info.version),
# shared by all Phase Two SDKs: the first release for API X.Y is X.Y.0, and later
# releases (e.g. SDK-only fixes) are X.Y.1, X.Y.2, ... based on this repo's tags.
# Skip with [ci skip] in the commit message.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test ./...
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api=$(sed -n 's/.*"apiVersion": *"\([^"]*\)".*/\1/p' sdk-generator.json)
          [ -n "$api" ] || { echo "::error::no apiVersion in sdk-generator.json"; exit 1; }
          mm=${api%.*}
          last=$(git tag --list "v$mm.*" --sort=-v:refname | head -1)
          if [ -z "$last" ]; then next="v$mm.0"; else next="v$mm.$(( ${last##*.} + 1 ))"; fi
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          gh release create "$next" --generate-notes --verify-tag
          # Ask the Go module proxy to fetch the new version so pkg.go.dev shows it.
          curl -fsS "https://proxy.golang.org/github.com/$GITHUB_REPOSITORY/@v/$next.info" || true
